<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720">
  <!-- Illustrated stand-in for the user's own photo (the mockup has no real photos). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef0"/>
      <stop offset="1" stop-color="#d5dfe2"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a63"/>
      <stop offset="1" stop-color="#1d3447"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#bg)"/>
  <circle cx="470" cy="150" r="120" fill="#ffffff" opacity=".35"/>
  <circle cx="110" cy="560" r="160" fill="#ffffff" opacity=".25"/>
  <!-- body -->
  <path d="M95 720 C 110 560, 190 505, 300 500 C 410 505, 490 560, 505 720 Z" fill="url(#shirt)"/>
  <path d="M250 505 L300 585 L350 505 Z" fill="#f4f6f7"/>
  <path d="M262 505 L300 566 L338 505" fill="none" stroke="#c9d3d8" stroke-width="3"/>
  <!-- neck -->
  <path d="M262 440 L262 512 C 280 530, 320 530, 338 512 L338 440 Z" fill="#d9a07c"/>
  <path d="M262 470 C 285 488, 315 488, 338 470 L338 455 L262 455 Z" fill="#c78d6a" opacity=".6"/>
  <!-- head -->
  <ellipse cx="300" cy="345" rx="112" ry="132" fill="#e3ad88"/>
  <ellipse cx="190" cy="352" rx="18" ry="30" fill="#d9a07c"/>
  <ellipse cx="410" cy="352" rx="18" ry="30" fill="#d9a07c"/>
  <!-- beard -->
  <path d="M196 360 C 200 450, 250 482, 300 482 C 350 482, 400 450, 404 360 C 392 400, 370 420, 345 424 C 330 410, 270 410, 255 424 C 230 420, 208 400, 196 360 Z" fill="#3a2a22"/>
  <path d="M268 432 C 285 444, 315 444, 332 432 C 318 438, 282 438, 268 432 Z" fill="#c9776a"/>
  <!-- hair -->
  <path d="M188 330 C 175 220, 240 185, 305 190 C 380 192, 425 235, 412 330 C 400 285, 380 262, 352 255 C 310 268, 250 262, 220 248 C 205 268, 195 292, 188 330 Z" fill="#3a2a22"/>
  <!-- glasses -->
  <g fill="none" stroke="#1f2a33" stroke-width="7">
    <rect x="222" y="318" width="70" height="52" rx="16"/>
    <rect x="308" y="318" width="70" height="52" rx="16"/>
    <path d="M292 338 C 297 333, 303 333, 308 338"/>
  </g>
  <circle cx="257" cy="344" r="7" fill="#1f2a33"/>
  <circle cx="343" cy="344" r="7" fill="#1f2a33"/>
  <path d="M236 302 C 250 294, 270 294, 284 300" stroke="#3a2a22" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M316 300 C 330 294, 350 294, 364 302" stroke="#3a2a22" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M300 352 C 296 372, 292 384, 304 390" stroke="#c78d6a" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
